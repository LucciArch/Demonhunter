:root{--bg:#0b070d;--panel:#1a1119;--panel2:#24161f;--line:#4a2a35;--txt:#f1e4d0;--dim:#9b8a7e;--red:#e5484d;--gold:#f2c14e;--soul:#8fd8ff;--brim:#ff8a3d;--sig:#ffd76a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:20px;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none;image-rendering:pixelated}
.hide{display:none!important}
h1,h2,h3,.px{font-family:'Pixelify Sans',monospace;margin:0}
input{accent-color:#c0303a}
button{font-family:'Pixelify Sans',monospace;font-size:17px;color:var(--txt);background:var(--panel2);border:2px solid var(--line);padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #000;border-radius:2px}
button:hover{border-color:#7a4655;background:#2e1c27}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:22px;padding:12px 26px;background:linear-gradient(#8e1d29,#5a0f19);border-color:#d0484f;color:#fff3dc;text-shadow:0 2px 0 #300}
#btnChron.glow{border-color:#7bff8a;animation:chGlow 1.4s ease-in-out infinite}@keyframes chGlow{50%{box-shadow:0 0 14px #7bff8a99}}
button.big:hover{background:linear-gradient(#a8232f,#6a1320)}
.cur{display:inline-flex;align-items:center;gap:6px;font-size:24px}
.cur i{display:inline-block;width:14px;height:14px;transform:rotate(45deg);border:2px solid #000}
.cur.s i{background:var(--soul);box-shadow:0 0 8px var(--soul)}
.cur.b i{background:var(--brim);box-shadow:0 0 8px var(--brim)}
.cur.a i{background:#ff4ad0;box-shadow:0 0 8px #ff4ad0;transform:rotate(45deg) scale(.85,1.15)}
.cur.g i{background:var(--sig);box-shadow:0 0 8px var(--sig);border-radius:50%;transform:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:8px 14px;background:linear-gradient(#000c,#0000);pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#title{font-family:'Pixelify Sans';font-weight:700;font-size:26px;color:#ffd9b0;text-shadow:0 0 12px #c0303a,0 2px 0 #500;letter-spacing:1px}
#curs{display:flex;gap:18px;margin-left:auto}
#side{position:fixed;left:10px;top:60px;width:250px;background:#140d13ee;border:2px solid var(--line);padding:10px;z-index:4}
#side .hn{font-family:'Pixelify Sans';font-size:19px;color:#ffd9b0}
#side .hp{color:var(--dim);font-size:17px;line-height:1.05;margin:4px 0 8px}
#stats{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:18px;line-height:1.1}
#stats span:nth-child(even){text-align:right;color:#ffe7b8}
#sideToggle{position:fixed;left:10px;top:60px;z-index:6;padding:4px 8px;font-size:14px}
#bottom{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;z-index:5;flex-wrap:wrap;pointer-events:none}
#bottom>*{pointer-events:auto}
#circleSel{display:flex;align-items:center;gap:6px;background:#140d13ee;border:2px solid var(--line);padding:4px 8px}
#circleSel .lbl{font-family:'Pixelify Sans';min-width:120px;text-align:center;cursor:pointer}
#circleSel .lbl:hover{color:var(--gold)}
#circleSel button{padding:4px 10px}
#tip{position:fixed;z-index:20;pointer-events:none;background:#120b11f2;border:2px solid #6a3a48;padding:8px 10px;max-width:280px;font-size:19px;line-height:1.05}
#tip .tn{font-family:'Pixelify Sans';font-size:18px;margin-bottom:3px}
#tip .tl{color:var(--dim)}
#tip .tc{margin-top:5px}
#info{position:fixed;right:10px;bottom:80px;z-index:6;width:270px;background:#140d13f4;border:2px solid #6a3a48;padding:10px;font-size:19px;line-height:1.05}
#info .tn{font-family:'Pixelify Sans';font-size:18px;margin-bottom:3px}
#info .tl{color:var(--dim)}
#info button{margin-top:8px;width:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 14px;pointer-events:none}
.bar{position:relative;height:18px;background:#1a0f14;border:2px solid #000;box-shadow:0 0 0 2px #4a2a35;margin-bottom:8px}
.bar>div{position:absolute;left:0;top:0;bottom:0}
.bar>span{position:absolute;inset:0;text-align:center;font-size:17px;line-height:15px;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
#hudRow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#hudRow{align-items:flex-start}
#hudL{display:flex;gap:8px;width:min(400px,40vw);background:linear-gradient(#1c1018ee,#100810dd);border:2px solid #000;box-shadow:0 0 0 2px #5a2a35,0 4px 0 #000a;padding:6px}
#hudL .grow{flex:1;min-width:0}#hudBoon{font-family:'VT323';font-size:16px;line-height:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hudBoon:empty{display:none}
#hudPort{width:52px;height:52px;flex:none;background:radial-gradient(#3a1a22,#120a0e);border:2px solid #000;box-shadow:inset 0 0 0 2px #7a3a40;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
#hudPort img{image-rendering:pixelated;height:46px}
.bar.hp{height:26px;margin-bottom:5px}.bar.bl{height:6px;margin-bottom:5px}#blFill{background:linear-gradient(90deg,#8a4aff,#ffd76a)}
.boon{width:190px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-color:var(--bc);font-size:16px;transition:transform .1s}.boon:hover{transform:translateY(-4px);box-shadow:0 0 16px var(--bc),0 3px 0 #000}
.boon .bi{font-size:40px;color:var(--bc);text-shadow:0 0 12px var(--bc);line-height:1}.boon b{font-size:20px;color:var(--bc)}.boon span{font-family:'VT323';font-size:19px;color:var(--txt)}.boon em{font-size:13px;color:#ffd76a;font-style:normal}
.boon.cursed{background:linear-gradient(#2a0a1a,#120410);box-shadow:0 0 18px #b0204a99,0 3px 0 #000}.boon.cursed i{color:#ff6a8a;font-style:normal}.boon.holy{background:linear-gradient(#3a2a10,#1e1408);box-shadow:0 0 18px #ffd76a88,0 3px 0 #000}.bar.tm{height:14px;margin:0}.bar.tm>span{font-size:13px;line-height:11px}
.bar>div{box-shadow:inset 0 3px 0 #ffffff40,inset 0 -3px 0 #0000004d}
#hpTrail{background:#ffe0c0;transition:width .5s ease-in .25s;box-shadow:none!important}
.bar.hp>span{font-family:'Pixelify Sans';font-weight:700;font-size:17px;line-height:23px}
.bar.hp>span::before{content:'♥ ';color:#ffb0b0}
#hudC{flex:1;max-width:520px;margin:0 auto;text-align:center}
#hudCirc{font-family:'Pixelify Sans';font-weight:700;font-size:20px;color:#ffd9b0;text-shadow:0 0 10px #c0303a,0 2px 0 #000;margin-bottom:4px}
.bar.q{height:20px}.bar.q>span{font-family:'Pixelify Sans';font-size:14px;line-height:17px}
#hudLoot{display:flex;gap:14px;align-items:center}
#btnQuit{pointer-events:auto;padding:4px 10px;font-size:14px}
#hudLoot .cur{font-size:22px}
#hudLoot .cur.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.35)}}
#ultWrap{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;z-index:6;pointer-events:none}
#ultBtn{pointer-events:auto;min-width:220px;padding:8px 14px;font-size:18px}
#ultBtn.ready{border-color:#ffd76a;box-shadow:0 0 16px #ffd76a,0 3px 0 #000;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
#ultBar{height:8px;background:#000;margin-top:4px;border:1px solid #4a2a35}
#ultFill{height:100%;width:0;background:linear-gradient(90deg,#ffb04a,#ffe08a)}
.ht{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.htn{background:#1e131c;border:2px solid #3e2430;padding:6px 8px;font-size:17px;line-height:1;cursor:pointer;text-align:left}
.htn b{font-family:'Pixelify Sans';font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.htn.lock{opacity:.4;cursor:default}.htn.max{border-color:#ffd76a}.htn.can{border-color:#7ad08a;box-shadow:0 0 8px #7ad08a55}
#bossBanner{position:fixed;top:30%;left:0;right:0;text-align:center;font-family:'Pixelify Sans';font-size:44px;font-weight:700;color:#ffd0a0;text-shadow:0 0 18px #ff2a2a,0 3px 0 #400;z-index:7;pointer-events:none;opacity:0;transition:opacity .4s}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}
#modal .box{background:#160e15;border:3px solid #6a3a48;box-shadow:0 0 0 3px #000,0 0 40px #a0203055;padding:18px 22px;min-width:300px;max-width:92vw;max-height:88vh;overflow:auto}
#modal h2{font-size:28px;color:#ffd9b0;text-shadow:0 0 10px #c0303a;margin-bottom:10px;text-align:center}
.sumgrid{display:grid;grid-template-columns:1fr auto;gap:2px 18px;font-size:22px;margin:8px 0 14px}
.sumgrid span:nth-child(even){text-align:right}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px;max-width:820px}
.hcard{background:#1e131c;border:2px solid #3e2430;padding:8px;text-align:center;cursor:pointer}
.hcard:hover{border-color:#7a4655}
.hcard.sel{border-color:var(--gold);box-shadow:0 0 12px #f2c14e55}
.hcard.lock{opacity:.55;cursor:default}
.hcard img{width:72px;height:auto;image-rendering:pixelated;display:block;margin:0 auto 4px}
.hcard .n{font-family:'Pixelify Sans';font-size:16px;color:#ffd9b0}
.hcard .d{font-size:16px;color:var(--dim);line-height:1}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:#1d121a;border:2px solid var(--gold);padding:8px 16px;font-family:'Pixelify Sans';font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:20px;cursor:pointer}
@media (max-width:700px){
 #hudL{width:100%}#hudC{order:3;flex-basis:100%}#hudCirc{font-size:16px}
 #side{width:200px;font-size:16px}
 #title{font-size:19px}
 .cur{font-size:19px}
 #curs{gap:10px}
 #info{left:10px;right:10px;width:auto;bottom:130px}
 button.big{font-size:19px;padding:10px 18px}
}
#btnChron.dot::after,#btnHeroes.dot::after{content:'●';color:#7bff8a;margin-left:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="title">DÄMONENJÄGER</div>
  <div id="curs">
    <span class="cur s" title="Seelen"><i></i><b id="cS">0</b></span>
    <span class="cur b" title="Schwefel"><i></i><b id="cB">0</b></span>
    <span class="cur g" title="Siegel"><i></i><b id="cG">0</b></span>
    <span class="cur a hide" id="cAw" title="Höllenfragmente"><i></i><b id="cA">0</b></span>
  </div>
</div>

<div id="hubUI">
  <button id="sideToggle">☰</button>
  <div id="side" class="hide">
    <div class="hn" id="sideName"></div>
    <div class="hp" id="sidePass"></div>
    <div id="stats"></div>
  </div>
  <div id="bottom">
    <div id="circleSel"><button id="cPrev" title="← Pfeiltaste">◀</button><span class="lbl" id="cLbl" title="Kreis wählen">1. Höllenkreis</span><button id="cNext" title="→ Pfeiltaste">▶</button></div>
    <button class="big" id="btnHunt" title="Leertaste">⚔ JAGD BEGINNEN</button>
    <button id="btnHeroes" title="Taste H">Jäger &amp; Ultimates</button>
    <button id="btnChron" title="Taste C">📜 Chronik</button>
    <button id="btnAsc" class="hide" style="border-color:#a03a90;color:#ffb0f0">✦ Aufstieg</button>
    <button id="btnMenu">⚙</button>
  </div>
  <div id="info" class="hide"></div>
</div>

<div id="hud" class="hide">
  <div id="hudRow">
    <div id="hudL"><div id="hudPort"><img id="hudImg" alt=""></div><div class="grow">
      <div class="bar hp"><div id="hpTrail"></div><div id="hpFill" style="background:linear-gradient(#ff6a6a,#d0283a 45%,#7a0e1e);width:100%"></div><span id="hpTxt"></span></div>
      <div class="bar bl" title="Segnung"><div id="blFill"></div></div>
      <div class="bar tm"><div id="tFill" style="background:linear-gradient(#a8d4ff,#4a86d8 45%,#1e4a90);width:100%"></div><span id="tTxt"></span></div>
      <div id="hudBoon"></div>
    </div></div>
    <div id="hudC"><div id="hudCirc"></div><div class="bar q"><div id="qFill" style="background:linear-gradient(#ffd07a,#e07a2a 45%,#8a3a12);width:0%"></div><span id="qTxt"></span></div></div>
    <div id="hudLoot">
      <span class="cur s"><i></i><b id="hS">0</b></span>
      <span class="cur b"><i></i><b id="hB">0</b></span>
      <span class="cur g"><i></i><b id="hG">0</b></span>
      <button id="btnQuit" title="Jagd beenden (Taste B)">⏹ Beenden</button>
    </div>
  </div>
</div>
<div id="ultWrap" class="hide"><button id="ultBtn"><span id="ultName">ULTIMATE</span><div id="ultBar"><div id="ultFill"></div></div></button></div>
<div id="bossBanner"></div>
<div id="tip" class="hide"></div>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>

function mkSprite(def){
  const rows=def.rows,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const f=(i,j)=>{if(j<0||j>=h||i<0)return false;const c=rows[j][i];return c!==undefined&&c!=='.'&&c!==' ';};
  const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
  x.fillStyle=OUTLINE;
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(f(i,j))continue;if(f(i-1,j)||f(i+1,j)||f(i,j-1)||f(i,j+1))x.fillRect(i+1,j+1,1,1);}
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(f(i,j)){x.fillStyle=def.pal[rows[j][i]]||'#f0f';x.fillRect(i+1,j+1,1,1);}
  const wc=document.createElement('canvas');wc.width=c.width;wc.height=c.height;const y=wc.getContext('2d');

}

function drawSpr(s,x,y,sc,flip,flash,alpha,black,o){
  const img=black?s.kc:s.c;
  ctx.save();if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);
  if(o){if(o.rot)ctx.rotate(o.rot);if(o.sx||o.sy)ctx.scale(o.sx||1,o.sy||1);}
  const X=Math.round(-s.w*sc/2),Y=Math.round(-s.h*sc);
  ctx.drawImage(img,X,Y,s.w*sc,s.h*sc);
  if(flash){ctx.globalAlpha=(alpha===undefined?1:alpha)*(typeof flash==='number'?flash:.55);ctx.drawImage(s.wc,X,Y,s.w*sc,s.h*sc);}
  ctx.restore();
}

  for(const n of HT[save.hero]){const l=htLv(n);if(l)t[n.key]=(t[n.key]||0)+n.val*l;}
  const g=k=>t[k]||0;const h=HB[save.hero];const s={};

  s.spawn=1+g('spawnPct')/100;
  s.collectDelay=Math.max(.25,(g('autoCollect')?.6:3)-g('collectDelay')*(g('autoCollect')?.1:1));
  s.soul=1+g('soulPct')/100;s.soulFlat=g('soulFlat');
  s.brim=1+g('brimPct')/100;s.brimFlat=g('brimFlat');

  s.dbl=g('doubleLoot')/100;s.golden=g('golden')/100;
  s.elite=g('eliteCh')/100;s.bossDmg=1+g('bossDmg')/100;s.bossLoot=1+g('bossLoot')/100;
  s.click=1+s.dmg*(.3+g('clickPct')/100);s.clickR=30*(1+g('clickAoe')/100);
  s.clickCrit=Math.min(95,5+g('clickCrit'));s.clickCritDmg=2+g('clickCritDmg')/100;
  s.autoSmite=g('autoSmite')?(1+g('autoSmiteSpd')/100):0;s.smiteN=1+g('autoSmiteCount');s.smiteTwice=g('smiteTwice');
  s.mark=g('markPct')/100;s.clickSoul=1+g('clickSoul')/100;
  s.aoe=1+g('aoe')/100;s.chain=g('chain');s.chainDmg=.5+g('chainDmg')/100;
  s.execute=g('execute')/100;s.explode=g('explode')/100;s.explodeR=55*(1+g('explodeR')/100);s.chainReact=g('chainReact');
  s.pierce=g('pierce')+(h.pierce||0);s.multi=g('multi');
  s.revive=g('revive');s.quota=1-g('quotaRed')/100;s.enemyHp=1-g('enemyHpRed')/100;
  s.dmg*=1+g('heroAll')/100;s.hp*=1+g('heroAll')/100;
  const ab=1+.02*achCount();s.dmg*=ab;s.soul*=ab;
  const hf=Math.pow(1.5,al('a16')),am=Math.pow(1+al('a17')*.03,save.ascCount||0);s.dmg*=am;s.hp*=am;s.dmg*=(1+al('a1')*.25)*hf;s.hp*=(1+al('a2')*.25)*hf;s.soul*=(1+al('a3')*.5)*hf;
  s.time+=al('a5')*2;s.brim*=1+al('a6')*.5;s.sigil*=1+al('a7')*.3;s.collectDelay=Math.max(.2,s.collectDelay-al('a11')*.5);
  s.quota*=1-al('a12')*.08;s.crit=Math.min(95,s.crit+al('a14')*3);s.ls+=al('a15')*.02;
  s.ultDmg=1+g('ultDmg')/100;s.ultKills=Math.max(4,20*(1-g('ultCharge')/100)*(1-al('a10')*.1));s.ultX=g('ultX');
  const mc=save.maxCircle-1;s.dmg*=1+g('dmgPerCircle')*mc/100;s.hp*=1+g('hpPerCircle')*mc/100;s.soul*=1+g('soulPerCircle')*mc/100;

const BG={};
function bgPattern(c){
  const k=(c-1)%CIRCLE_TINT.length;if(BG[k])return BG[k];
  const [a,b,glow]=CIRCLE_TINT[k];const T=96;
  const t=document.createElement('canvas');t.width=T;t.height=T;const x=t.getContext('2d');
  x.fillStyle=a;x.fillRect(0,0,T,T);
  // flagstones
  let seed=k*977+13;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let j=0;j<T;j+=16)for(let i=0;i<T;i+=24){const ox=(j/16)%2?12:0;x.fillStyle=b;x.fillRect((i+ox)%T+1,j+1,22,14);x.fillStyle=a;if(R()<.5)x.fillRect((i+ox)%T+3+Math.floor(R()*14),j+3+Math.floor(R()*8),2,2);
    x.fillStyle='rgba(255,255,255,.04)';x.fillRect((i+ox)%T+1,j+1,22,1);x.fillStyle='rgba(0,0,0,.25)';x.fillRect((i+ox)%T+1,j+14,22,1);}
  // lava cracks
  for(let n=0;n<4;n++){let px=Math.floor(R()*T),py=Math.floor(R()*T);x.fillStyle=glow;for(let s=0;s<14;s++){x.globalAlpha=.55+R()*.4;x.fillRect(px%T,py%T,1,1);px+=Math.floor(R()*3)-1+ (R()<.5?1:0);py+=Math.floor(R()*3)-1;}x.globalAlpha=1;}
  const big=document.createElement('canvas');const sc=3;big.width=T*sc;big.height=T*sc;const y=big.getContext('2d');y.imageSmoothingEnabled=false;y.drawImage(t,0,0,big.width,big.height);
  BG[k]=ctx.createPattern(big,'repeat');return BG[k];
}

function critRoll(ch){return Math.random()*100<ch;}
function heroAttack(){
  const hp=heroPos(),h=HB[save.hero];
  const alive=R.en.filter(e=>!e.dead);
  if(!alive.length)return false;
  alive.sort((a,b)=>(Math.hypot(a.x-hp.x,a.y-hp.y)-a.r)-(Math.hypot(b.x-hp.x,b.y-hp.y)-b.r));
  const inR=alive.filter(e=>Math.hypot(e.x-hp.x,e.y-(hp.y-20))-e.r<ST.range);
  if(!inR.length)return false;
  const tgt=inR[0];R.hero.flip=tgt.x<hp.x;
  const mk=()=>{const c=critRoll(ST.crit+(R.moon>0?30:0));return {amt:ST.dmg*(R.moon>0?1+(ST.ultDmg-1)*.5:1)*(c?ST.critDmg:1)*rnd(.9,1.1),crit:c};};
  const extra=ST.pierce+ST.multi;
  if(h.type==='bolt'){
    const n=1+ST.multi;
    for(let i=0;i<n;i++){const t=inR[i%inR.length];const a=Math.atan2(t.y-t.r-(hp.y-28),t.x-hp.x)+(i?(i%2?1:-1)*.12*Math.ceil(i/2):0);
      R.pr.push({x:hp.x+(R.hero.flip?-14:14),y:hp.y-28,vx:Math.cos(a)*720,vy:Math.sin(a)*720,pierce:ST.pierce,hit:new Set(),t:0});}
    rangedStart();R.fx.push({k:'boom',x:hp.x+(R.hero.flip?-18:18),y:hp.y-28,r:9,t:0,dur:.1});sfxL('hit');
  }else if(h.type==='pulse'){
    rangedStart();R.fx.push({k:'ring',x:hp.x,y:hp.y-12,r:ST.range,t:0,dur:.35,col:'#ffe08a'});
    for(const e of inR){const m=mk();dealDmg(e,m.amt,{crit:m.crit,ls:1});if(ST.chain)chainFrom(e,m.amt);}
    sfxL('hit');
  }else if(h.type==='sweep'){
    swingStart();
    R.fx.push({k:'sweep',x:hp.x,y:hp.y-22,r:ST.range*ST.aoe,t:-R.hero.swD*.3,dur:.22});
    for(const e of inR.filter(e=>Math.hypot(e.x-hp.x,e.y-hp.y)-e.r<ST.range*ST.aoe)){const m=mk();dealDmg(e,m.amt,{crit:m.crit,ls:1});}
    if(ST.chain){chainFrom(tgt,ST.dmg);}
    R.hero.lunge=.12;sfxL('hit');
  }else if(h.type==='cloud'){
    rangedStart();// Phiole fliegt im Bogen, die Wolke entsteht beim Aufschlag
    for(const t of inR.slice(0,1+ST.multi)){const x=t.x,y=t.y-6,fl=R.hero.raD;R.fx.push({k:'flask',x:hp.x+(R.hero.flip?-10:10),y:hp.y-34,x2:x,y2:y,t:0,dur:fl});
      R.later.push({t:fl,fn:()=>{R.clouds.push({x,y,r:60*ST.aoe,t:0,dur:2.5,tk:0,m:.4});R.fx.push({k:'boom',x,y:y-4,r:20,t:0,dur:.2});}});}
    sfxL('hit');
  }else if(h.type==='bash'){
    swingStart();
    const m=mk();dealDmg(tgt,m.amt,{crit:m.crit,ls:1});
    for(const e of inR.slice(0,3+extra)){if(e.dead||e.boss)continue;const d=Math.hypot(e.x-hp.x,e.y-hp.y)||1;e.kb=.15;e.kx=(e.x-hp.x)/d*420;e.ky=(e.y-hp.y)/d*420;}
    R.hero.bsh=.22;R.fx.push({k:'ring',x:(hp.x+tgt.x)/2,y:(hp.y+tgt.y)/2-14,r:ST.range*.7,col:'#ffe08a',t:-.06,dur:.25}); // Schild schnellt vor, goldene Stoßwelle
    for(let i=0;i<8;i++){const d=R.hero.flip?-1:1;R.pt.push({x:hp.x+d*22,y:hp.y-20,vx:d*rnd(120,320),vy:rnd(-140,60),t:0,life:rnd(.18,.35),c:i%2?'#ffe08a':'#ffffff',s:2});}
    if(ST.chain)chainFrom(tgt,m.amt);R.hero.lunge=.12;sfxL('crit');
  }else{
    // cleave / slam
    swingStart();const targets=inR.slice(0,1+extra);
    for(const t of targets){
      const m=mk();const mult=h.type==='slam'?1:1;
      dealDmg(t,m.amt*mult,{crit:m.crit,ls:1});
      const ang=Math.atan2(t.y-hp.y,t.x-hp.x);
      if(h.type==='slam'){const r=62*ST.aoe;R.fx.push({k:'quake',x:t.x,y:t.y,r,t:0,dur:.35});shake=Math.max(shake,4);
        for(const e of R.en)if(!e.dead&&e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<r+e.r)dealDmg(e,m.amt*.5,{ls:1});}
      else{R.fx.push({k:'slash',x:hp.x,y:hp.y-22,a:ang,r:ST.range*.9,t:-R.hero.swD*.3,dur:.16});
        const cr=36*ST.aoe;for(const e of R.en)if(!e.dead&&e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<cr+e.r)dealDmg(e,m.amt*.4,{ls:1});}
      if(ST.chain)chainFrom(t,m.amt);
    }
    R.hero.lunge=.12;R.hero.lx=Math.cos(Math.atan2(tgt.y-hp.y,tgt.x-hp.x));R.hero.ly=0;
    sfxL(h.type==='slam'?'crit':'hit');
  }
  return true;
}

function updateFx(dt){

  if(R.tx.length>80)R.tx.splice(0,R.tx.length-80);
  for(const p of R.pt){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.gy&&p.y>p.gy&&p.vy>0){p.y=p.gy;p.vy=0;p.vx=0;}}R.pt=R.pt.filter(p=>p.t<p.life);

const bossSig=()=>((1+Math.floor((R.c-1)/2))*ST.sigil+ST.sigilFlat)*(R.mod==='flood'?2:1)*(R.mod==='frost'?1.4:1)*(R.bmoon?2*ST.moonSig:1);
function endRun(why){
  if(R.over)return;R.over=true;R.why=why;
  // remaining loot is lost; give what was gathered (Reliquien nie verlieren)
  for(const l of R.loot)if(l.cur==='a')gainArt(l.v);else if(l.hud)R.sig+=l.v;
  const bo=R.en.find(e=>e.boss&&!e.dead);// knapp gescheitert (≤25% Leben): Trostpreis von einem Viertel der Fürsten-Siegel
  if(bo){R.bossPct=Math.max(1,Math.ceil(bo.hp/bo.max*100));if(R.bossPct<=25){R.cons=Math.max(1,Math.floor(bossSig()*ST.bossLoot*.25));R.sig+=R.cons;}}
  if(R.t>3)save.st.rate=Math.max(R.souls/R.t,(save.st.rate||0)*.9);
  save.souls+=R.souls;save.brim+=R.brim;save.sig+=R.sig;save.st.runs++;save.st.best=Math.max(save.st.best,R.kills);
  save.st.soulsTotal=(save.st.soulsTotal||0)+R.souls;if(why==='dead')save.st.deaths=(save.st.deaths||0)+1;save.st.maxC=Math.max(save.st.maxC||0,save.maxCircle);
  R.quests=claimQuests();
  if(al('a9'))R.autoBought=autoBuy();
  R.ach=checkAch();
  persist();
  setTimeout(showSummary,why==='dead'?900:600);
}
function autoBuy(){let n=0;for(let i=0;i<300;i++){let best=null,bc=Infinity;for(const x of NODES){if(x.root||x.cur!=='s'||x.key==='unlock'||!nodeAvail(x)||lv(x.id)>=x.max)continue;const c=nodeCost(x);if(c<bc){bc=c;best=x;}}
  if(!best||bc>save.souls)break;save.souls-=bc;save.tree[best.id]=lv(best.id)+1;n++;}computeStats();return n;}
function ascend(){

  const keep={root:1};for(const k in save.tree){if(k.startsWith('H_')||(NB[k]&&NB[k].key==='unlock'))keep[k]=save.tree[k];}
  save.tree=keep;save.souls=0;save.brim=0;save.sig=0;save.maxCircle=ascStart();save.circle=save.maxCircle;

  else{const st=save.st;const rows=[['Spielzeit',fmtTime(st.play||0)],['Jagden',fmt(st.runs||0)],['Tode',fmt(st.deaths||0)],['Dämonen vernichtet',fmt(st.kills||0)],['Fürsten besiegt',fmt(st.bosses||0)],['Elite vernichtet',fmt(st.elites||0)],['Beste Jagd',fmt(st.best||0)+' Kills'],['Beste Kombo',fmt(st.combo||0)],['Tiefster Kreis',Math.max(save.maxCircle,st.maxC||0)],['Seelen gesammelt',fmt(st.soulsTotal||0)],['Bannstrahlen',fmt(st.smites||0)],['Ultimates',fmt(st.ults||0)],['Aufstiege',fmt(save.ascCount||0)],['Fragmente gesamt',fmt(save.fragTotal||0)],['Reliquien geschmolzen',fmt(st.forged||0)],['Erfolge',achCount()+' / '+ACH.length]];

  }

cv.addEventListener('pointermove',e=>{

  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;$('#tip').classList.add('hide');}}
  else if(canHover&&e.pointerType==='mouse'){const n=nodeAt(e.clientX,e.clientY);hoverNode=n;const t=$('#tip');
    if(n){t.innerHTML=nodeHTML(n)+(n.root?'':`<div class="tl" style="margin-top:4px">Klicken zum Kaufen</div>`);t.classList.remove('hide');const x=Math.min(e.clientX+18,W-300),y=Math.min(e.clientY+18,H-170);t.style.left=x+'px';t.style.top=y+'px';cv.style.cursor='pointer';}
    else{t.classList.add('hide');cv.style.cursor='grab';}}
});
function pUp(e){
  pts.delete(e.pointerId);ptr.down=false;
  if(mode==='hub'){
    if(pinch&&pts.size<2){pinch=null;drag=null;return;}
    if(drag&&!drag.moved){const n=nodeAt(e.clientX,e.clientY);
      if(n){if(canHover&&e.pointerType==='mouse'){if(!buyNode(n)&&!n.root&&nodeAvail(n)&&lv(n.id)<n.max){toast('Nicht genug '+{s:'Seelen',b:'Schwefel',g:'Siegel'}[n.cur]);}
          const t=$('#tip');if(!t.classList.contains('hide'))t.innerHTML=nodeHTML(n);}
        else{selNode=n;showInfo(n);}}
      else{$('#info').classList.add('hide');selNode=null;}}
    drag=null;
  }
  if(e.pointerType!=='mouse')ptr.active=false;
}
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){ptr.active=false;hoverNode=null;$('#tip').classList.add('hide');}});
cv.addEventListener('wheel',e=>{if(mode!=='hub')return;e.preventDefault();const before=s2w(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.pow(1.0015,-e.deltaY),.35,2.2);const after=s2w(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y;},{passive:false});
$('#btnQuit').onclick=quitRun;
function quitRun(){if(mode==='run'&&R&&!R.over){R.paused=false;R.choosing=null;$('#ultBtn').disabled=false;endRun('quit');}}
addEventListener('keydown',e=>{if(e.code==='KeyB'&&mode==='run'){quitRun();return;}if(e.code==='Escape'){if(mode==='hub')closeModal();else if(R&&!R.over&&!R.choosing){R.paused=!R.paused;$('#ultBtn').disabled=R.paused;}return;}
  if(R&&R.choosing){if(e.code==='KeyR'){rerollBoons();return;}const o=R.choosing.opts[+e.key-1];if(o)R.choosing.pick(o);return;}
  if(R&&R.paused)return;if((e.code==='Space'||e.code==='KeyQ')&&mode==='run'){e.preventDefault();castUlt();return;}if(mode!=='hub'||!$('#modal').classList.contains('hide'))return;
  const b={Space:'#btnHunt',KeyH:'#btnHeroes',KeyC:'#btnChron',ArrowLeft:'#cPrev',ArrowRight:'#cNext'}[e.code];
  if(b&&!$(b).disabled){e.preventDefault();$(b).click();}});

let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;sfxCount=0;save.st.play=(save.st.play||0)+dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  if(mode==='run'&&R){
    if(!R.paused&&!R.choosing){let d=dt;if(R.slow>0){R.slow-=dt;d*=.25;}updateRun(d);}
    let sx=0,sy=0;if(shake>0&&save.opt.shake){sx=rnd(-shake,shake);sy=rnd(-shake,shake);shake=Math.max(0,shake-dt*40);}
    ctx.save();ctx.translate(sx,sy);R.zz=null;
    if(R.zoom){const Z=R.zoom;if(!R.paused)Z.t+=dt;const p=Z.t/Z.dur;if(p>=1)R.zoom=null;else{const z=1+.18*Math.sin(Math.PI*Math.min(1,p*1.6))*(p<.6?1:(1-p)/.4),fx=W/2+(Z.x-W/2)*.6,fy=H/2+(Z.y-H/2)*.6;R.zz={z,fx,fy};ctx.translate(fx,fy);ctx.scale(z,z);ctx.translate(-fx,-fy);}}
    renderRun();ctx.restore();drawCombo();
    if(R.paused){ctx.save();ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd9b0';ctx.textAlign='center';ctx.font='48px "Pixelify Sans"';ctx.fillText('PAUSE',W/2,H/2);ctx.font='22px "Pixelify Sans"';ctx.fillText('Esc zum Fortsetzen · B zum Beenden',W/2,H/2+36);ctx.restore();}
    // HUD
    $('#hpFill').style.width=$('#hpTrail').style.width=(100*Math.max(0,R.hp)/R.maxHp)+'%';$('#hpTxt').textContent=`${fmt(Math.max(0,R.hp))} / ${fmt(R.maxHp)}`;
    $('#tFill').style.width=(100*R.time/R.maxTime)+'%';$('#blFill').style.width=(100*R.bl/R.blN)+'%';$('#tTxt').textContent=`⧗ ${R.time.toFixed(1)}s`;
    if(!R.bossSpawned){$('#qFill').style.width=(100*Math.min(1,R.kills/R.quota))+'%';$('#qTxt').textContent=`Fürst erscheint: ${R.kills}/${R.quota}`;}
    else if(!R.bossDead){const b=R.en.find(e=>e.boss);$('#qFill').style.width=(b?100*b.hp/b.max:0)+'%';$('#qTxt').textContent=(b&&b.name||'FÜRST').toUpperCase();}
    else{$('#qFill').style.width='100%';$('#qTxt').textContent='Fürst gebannt! Kills: '+R.kills;}
    $('#ultName').textContent=ULT[save.hero].name+(R.ult>=1?' (Leertaste)':'');$('#ultFill').style.width=(R.ult*100)+'%';$('#ultBtn').classList.toggle('ready',R.ult>=1);
    $('#hS').textContent=fmt(R.souls);$('#hB').textContent=fmt(R.brim);$('#hG').textContent=fmt(R.sig);
    refreshCur();
  }else{
    renderHub(dt);
  }
  requestAnimationFrame(frame);
}
computeStats();showUI();refreshHub();
if(!save.seenIntro){save.seenIntro=true;persist();setTimeout(menu,400);}
else{// Offline-Fortschritt: 25% der zuletzt erjagten Seelen/s, max. 8 Stunden
  const away=save.last?Math.min(8*3600,(Date.now()-save.last)/1000):0,gain=Math.floor(away*(save.st.rate||0)*.25);
  if(away>60&&gain>0){save.souls+=gain;persist();refreshHub();
    openModal(`<h2>WILLKOMMEN ZURÜCK</h2><div style="text-align:center;font-size:21px;line-height:1.2;max-width:420px">Du warst ${fmtTime(away)} fort.${away>=8*3600?' <span style="color:var(--dim)">(höchstens 8 h zählen)</span>':''}<br>Dein Orden jagte weiter und sammelte<br><span class="cur s" style="font-size:28px;margin:8px 0"><i></i>${fmt(gain)} Seelen</span></div><div class="row"><button class="big" id="wbOk">Weiter</button></div>`);
    $('#wbOk').onclick=closeModal;}}
addEventListener('pagehide',persist);setInterval(persist,30000);
requestAnimationFrame(frame);
