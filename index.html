<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dämonenjäger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b070d;--panel:#1a1119;--panel2:#24161f;--line:#4a2a35;--txt:#f1e4d0;--dim:#9b8a7e;--red:#e5484d;--gold:#f2c14e;--soul:#8fd8ff;--brim:#ff8a3d;--sig:#ffd76a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:20px;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none;image-rendering:pixelated}
.hide{display:none!important}
h1,h2,h3,.px{font-family:'Pixelify Sans',monospace;margin:0}
button{font-family:'Pixelify Sans',monospace;font-size:17px;color:var(--txt);background:var(--panel2);border:2px solid var(--line);padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #000;border-radius:2px}
button:hover{border-color:#7a4655;background:#2e1c27}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:22px;padding:12px 26px;background:linear-gradient(#8e1d29,#5a0f19);border-color:#d0484f;color:#fff3dc;text-shadow:0 2px 0 #300}
button.big:hover{background:linear-gradient(#a8232f,#6a1320)}
.cur{display:inline-flex;align-items:center;gap:6px;font-size:24px}
.cur i{display:inline-block;width:14px;height:14px;transform:rotate(45deg);border:2px solid #000}
.cur.s i{background:var(--soul);box-shadow:0 0 8px var(--soul)}
.cur.b i{background:var(--brim);box-shadow:0 0 8px var(--brim)}
.cur.g i{background:var(--sig);box-shadow:0 0 8px var(--sig);border-radius:50%;transform:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:8px 14px;background:linear-gradient(#000c,#0000);pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#title{font-family:'Pixelify Sans';font-weight:700;font-size:26px;color:#ffd9b0;text-shadow:0 0 12px #c0303a,0 2px 0 #500;letter-spacing:1px}
#curs{display:flex;gap:18px;margin-left:auto}
#side{position:fixed;left:10px;top:60px;width:250px;background:#140d13ee;border:2px solid var(--line);padding:10px;z-index:4}
#side .hn{font-family:'Pixelify Sans';font-size:19px;color:#ffd9b0}
#side .hp{color:var(--dim);font-size:17px;line-height:1.05;margin:4px 0 8px}
#stats{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:18px;line-height:1.1}
#stats span:nth-child(even){text-align:right;color:#ffe7b8}
#sideToggle{position:fixed;left:10px;top:60px;z-index:6;padding:4px 8px;font-size:14px}
#bottom{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;z-index:5;flex-wrap:wrap;pointer-events:none}
#bottom>*{pointer-events:auto}
#circleSel{display:flex;align-items:center;gap:6px;background:#140d13ee;border:2px solid var(--line);padding:4px 8px}
#circleSel .lbl{font-family:'Pixelify Sans';min-width:120px;text-align:center}
#circleSel button{padding:4px 10px}
#tip{position:fixed;z-index:20;pointer-events:none;background:#120b11f2;border:2px solid #6a3a48;padding:8px 10px;max-width:280px;font-size:19px;line-height:1.05}
#tip .tn{font-family:'Pixelify Sans';font-size:18px;margin-bottom:3px}
#tip .tl{color:var(--dim)}
#tip .tc{margin-top:5px}
#info{position:fixed;right:10px;bottom:80px;z-index:6;width:270px;background:#140d13f4;border:2px solid #6a3a48;padding:10px;font-size:19px;line-height:1.05}
#info .tn{font-family:'Pixelify Sans';font-size:18px;margin-bottom:3px}
#info .tl{color:var(--dim)}
#info button{margin-top:8px;width:100%}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 14px;pointer-events:none}
.bar{position:relative;height:18px;background:#1a0f14;border:2px solid #000;box-shadow:0 0 0 2px #4a2a35;margin-bottom:8px}
.bar>div{position:absolute;left:0;top:0;bottom:0}
.bar>span{position:absolute;inset:0;text-align:center;font-size:17px;line-height:15px;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
#hudRow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#hudRow .grow{flex:1;min-width:180px}
#hudLoot{display:flex;gap:14px}
#hudLoot .cur{font-size:22px}
#bossBanner{position:fixed;top:30%;left:0;right:0;text-align:center;font-family:'Pixelify Sans';font-size:44px;font-weight:700;color:#ffd0a0;text-shadow:0 0 18px #ff2a2a,0 3px 0 #400;z-index:7;pointer-events:none;opacity:0;transition:opacity .4s}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}
#modal .box{background:#160e15;border:3px solid #6a3a48;box-shadow:0 0 0 3px #000,0 0 40px #a0203055;padding:18px 22px;min-width:300px;max-width:92vw;max-height:88vh;overflow:auto}
#modal h2{font-size:28px;color:#ffd9b0;text-shadow:0 0 10px #c0303a;margin-bottom:10px;text-align:center}
.sumgrid{display:grid;grid-template-columns:1fr auto;gap:2px 18px;font-size:22px;margin:8px 0 14px}
.sumgrid span:nth-child(even){text-align:right}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px;max-width:820px}
.hcard{background:#1e131c;border:2px solid #3e2430;padding:8px;text-align:center;cursor:pointer}
.hcard:hover{border-color:#7a4655}
.hcard.sel{border-color:var(--gold);box-shadow:0 0 12px #f2c14e55}
.hcard.lock{opacity:.55;cursor:default}
.hcard img{width:72px;height:auto;image-rendering:pixelated;display:block;margin:0 auto 4px}
.hcard .n{font-family:'Pixelify Sans';font-size:16px;color:#ffd9b0}
.hcard .d{font-size:16px;color:var(--dim);line-height:1}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:#1d121a;border:2px solid var(--gold);padding:8px 16px;font-family:'Pixelify Sans';font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:20px;cursor:pointer}
@media (max-width:700px){
 #side{width:200px;font-size:16px}
 #title{font-size:19px}
 .cur{font-size:19px}
 #curs{gap:10px}
 #info{left:10px;right:10px;width:auto;bottom:130px}
 button.big{font-size:19px;padding:10px 18px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="title">DÄMONENJÄGER</div>
  <div id="curs">
    <span class="cur s" title="Seelen"><i></i><b id="cS">0</b></span>
    <span class="cur b" title="Schwefel"><i></i><b id="cB">0</b></span>
    <span class="cur g" title="Siegel"><i></i><b id="cG">0</b></span>
  </div>
</div>

<div id="hubUI">
  <button id="sideToggle">☰</button>
  <div id="side" class="hide">
    <div class="hn" id="sideName"></div>
    <div class="hp" id="sidePass"></div>
    <div id="stats"></div>
  </div>
  <div id="bottom">
    <div id="circleSel"><button id="cPrev">◀</button><span class="lbl" id="cLbl">1. Höllenkreis</span><button id="cNext">▶</button></div>
    <button class="big" id="btnHunt">⚔ JAGD BEGINNEN</button>
    <button id="btnHeroes">Jäger wählen</button>
    <button id="btnMenu">⚙</button>
  </div>
  <div id="info" class="hide"></div>
</div>

<div id="hud" class="hide">
  <div id="hudRow">
    <div class="grow">
      <div class="bar"><div id="hpFill" style="background:linear-gradient(#e5484d,#9a1c28);width:100%"></div><span id="hpTxt"></span></div>
      <div class="bar"><div id="tFill" style="background:linear-gradient(#7ab8ff,#2f5fb0);width:100%"></div><span id="tTxt"></span></div>
      <div class="bar"><div id="qFill" style="background:linear-gradient(#ffb04a,#a8481e);width:0%"></div><span id="qTxt"></span></div>
    </div>
    <div id="hudLoot">
      <span class="cur s"><i></i><b id="hS">0</b></span>
      <span class="cur b"><i></i><b id="hB">0</b></span>
      <span class="cur g"><i></i><b id="hG">0</b></span>
    </div>
  </div>
</div>
<div id="bossBanner"></div>
<div id="tip" class="hide"></div>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

  x.fillStyle=OUTLINE;
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(f(i,j))continue;if(f(i-1,j)||f(i+1,j)||f(i,j-1)||f(i,j+1))x.fillRect(i+1,j+1,1,1);}

function drawSpr(s,x,y,sc,flip,flash,alpha,black){
  const img=black?s.kc:s.c;
  ctx.save();if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);
  const X=Math.round(-s.w*sc/2),Y=Math.round(-s.h*sc);
  ctx.drawImage(img,X,Y,s.w*sc,s.h*sc);
  if(flash){ctx.globalAlpha=(alpha===undefined?1:alpha)*(typeof flash==='number'?flash:.55);ctx.drawImage(s.wc,X,Y,s.w*sc,s.h*sc);}
  ctx.restore();
}

  for(let j=0;j<T;j+=16)for(let i=0;i<T;i+=24){const ox=(j/16)%2?12:0;x.fillStyle=b;x.fillRect((i+ox)%T+1,j+1,22,14);x.fillStyle=a;if(R()<.5)x.fillRect((i+ox)%T+3+Math.floor(R()*14),j+3+Math.floor(R()*8),2,2);
    x.fillStyle='rgba(255,255,255,.04)';x.fillRect((i+ox)%T+1,j+1,22,1);x.fillStyle='rgba(0,0,0,.25)';x.fillRect((i+ox)%T+1,j+14,22,1);}
  // lava cracks
  for(let n=0;n<4;n++){let px=Math.floor(R()*T),py=Math.floor(R()*T);x.fillStyle=glow;for(let s=0;s<14;s++){x.globalAlpha=.55+R()*.4;x.fillRect(px%T,py%T,1,1);px+=Math.floor(R()*3)-1+ (R()<.5?1:0);py+=Math.floor(R()*3)-1;}x.globalAlpha=1;}
  const big=document.createElement('canvas');const sc=3;big.width=T*sc;big.height=T*sc;const y=big.getContext('2d');y.imageSmoothingEnabled=false;y.drawImage(t,0,0,big.width,big.height);

}

  if(l&&!maxed&&!n.root){ // progress fill
    ctx.save();shape();ctx.clip();ctx.fillStyle=col;ctx.globalAlpha=.35;ctx.fillRect(-r,r-2*r*(l/n.max),2*r,2*r*(l/n.max));ctx.restore();}
  if(maxed&&!n.root){ctx.save();shape();ctx.clip();ctx.fillStyle=col;ctx.globalAlpha=.5;ctx.fillRect(-r,-r,2*r,2*r);ctx.restore();}
  if(hidden){ctx.fillStyle='#4a3540';ctx.font=`${Math.max(10,18*cam.z)|0}px "Pixelify Sans"`;ctx.textAlign='center';ctx.fillText('?',0,6*cam.z);}
  else if(n.ch){const s=SPR[HB[n.ch].spr];const sc=Math.max(1,1.6*cam.z);ctx.imageSmoothingEnabled=false;drawSprAt(s,0,s.h*sc/2,sc,!l);}
  else if(n.root){const s=SPR[HB[save.hero].spr];const sc=Math.max(1,1.8*cam.z);drawSprAt(s,0,s.h*sc/2,sc,false);}
  else{drawIcon(n.key,col,r*.55,l>0);}
  if(!n.root&&!hidden&&n.max>1&&cam.z>.55){ctx.font=`${Math.max(11,14*cam.z)|0}px "VT323"`;ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(l+'/'+n.max,1,r+13*cam.z+1);ctx.fillStyle=maxed?'#ffd76a':'#d8c8b8';ctx.fillText(l+'/'+n.max,0,r+13*cam.z);}
  if(n===hoverNode||n===selNode){ctx.strokeStyle='#fff';ctx.lineWidth=2;shape();ctx.stroke();}
  ctx.restore();
}
function drawSprAt(s,x,y,sc,black){ctx.drawImage(black?s.kc:s.c,Math.round(x-s.w*sc/2),Math.round(y-s.h*sc),s.w*sc,s.h*sc);}
// icons: tiny pixel glyphs (5x5) per stat
const ICON={
 dmg:["..#..","..#..","..#..",".###.","..#.."],spd:["#.#..",".#.#.","..#.#",".#.#.","#.#.."],aoe:[".###.","#...#","#.#.#","#...#",".###."],
 hp:[".#.#.","#####","#####",".###.","..#.."],arm:["#####","#####","#####",".###.","..#.."],regen:["..#..","..#..","#####","..#..","..#.."],
 time:["#####",".#.#.","..#..",".#.#.","#####"],mag:["#...#","#...#","#...#",".#.#.","..#.."],loot:["..#..",".###.","##.##",".###.","..#.."],
 click:["...#.","..#..",".###.","..#..",".#..."],crit:["#...#",".#.#.","..#..",".#.#.","#...#"],boom:["#.#.#",".###.","##.##",".###.","#.#.#"],
 skull:[".###.","#.#.#","#####",".###.",".#.#."],chain:["#....",".#...","..#.#","...#.","....#"],thorn:["#.#.#",".###.","#####",".###.","#.#.#"],star:["..#..","#####",".###.",".#.#.","#...#"]
};
const KEYICON={dmgFlat:'dmg',dmgPct:'dmg',atkSpd:'spd',aoe:'aoe',bossDmg:'skull',chain:'chain',chainDmg:'chain',execute:'skull',multi:'star',hpFlat:'hp',hpPct:'hp',armor:'arm',regen:'regen',revive:'regen',thorns:'thorn',lifesteal:'hp',
 runTime:'time',magnet:'mag',spawnPct:'skull',autoCollect:'mag',collectDelay:'mag',quotaRed:'time',soulPct:'loot',doubleLoot:'loot',brimPct:'loot',golden:'star',sigilPct:'loot',soulFlat:'loot',eliteCh:'skull',brimFlat:'loot',bossLoot:'loot',sigilFlat:'loot',
 clickPct:'click',clickAoe:'aoe',clickCrit:'crit',clickCritDmg:'crit',autoSmite:'click',autoSmiteSpd:'spd',autoSmiteCount:'click',smiteTwice:'star',markPct:'click',clickSoul:'loot',crit:'crit',critDmg:'crit',explode:'boom',explodeR:'boom',pierce:'dmg',chainReact:'boom',enemyHpRed:'skull',dmgPerCircle:'dmg',hpPerCircle:'hp',soulPerCircle:'loot',frenzy:'spd',killTime:'time'};
function drawIcon(key,col,size,on){const g=ICON[KEYICON[key]]||ICON.star;const px=Math.max(1,size*2/5);ctx.fillStyle=on?'#fff8e8':col;ctx.globalAlpha=on?1:.75;
  for(let j=0;j<5;j++)for(let i=0;i<5;i++)if(g[j][i]==='#')ctx.fillRect(Math.round((i-2.5)*px),Math.round((j-2.5)*px),Math.ceil(px),Math.ceil(px));ctx.globalAlpha=1;}

function nodeHTML(n){
  if(n.root)return `<div class="tn" style="color:#ff6a6a">Der Schwur</div><div class="tl">Das Herz deines Ordens. Alle Pfade beginnen hier.<br>Seelen kaufen Knoten. Schwefel droppen Elite-Dämonen ab Kreis 2, Siegel nur Fürsten.</div>`;
  const l=lv(n.id),maxed=l>=n.max,av=nodeAvail(n);const col=BR[n.br].col;
  let h=`<div class="tn" style="color:${col}">${n.name}${n.ks?' ◆':''}</div>`;
  if(!av)return h+`<div class="tl">Gesperrt. Kaufe zuerst den vorherigen Knoten.</div>`;
  h+=`<div>${FX[n.key](n.key==='unlock'?n.val:+(n.val).toFixed(2))}${n.max>1?' <span class="tl">pro Stufe</span>':''}</div>`;
  if(n.max>1&&l>0&&n.key!=='unlock')h+=`<div class="tl">Aktuell: ${FX[n.key](+(n.val*l).toFixed(2))}</div>`;
  h+=`<div class="tl">Stufe ${l}/${n.max} · ${BR[n.br].name}</div>`;
  if(!maxed){const c=nodeCost(n);const ok=curAmt(n.cur)>=c;const nm={s:'Seelen',b:'Schwefel',g:'Siegel'}[n.cur];
    h+=`<div class="tc"><span class="cur ${n.cur}" style="font-size:20px"><i></i><span style="color:${ok?'#bfffbf':'#ff8a8a'}">${fmt(c)} ${nm}</span></span></div>`;}
  else h+=`<div class="tc" style="color:#ffd76a">MAXIMAL</div>`;
  return h;
}
function buyNode(n){
  if(n.root||!nodeAvail(n))return false;const l=lv(n.id);if(l>=n.max)return false;const c=nodeCost(n);if(curAmt(n.cur)<c){return false;}
  curSub(n.cur,c);save.tree[n.id]=l+1;sfx('buy');persist();computeStats();refreshHub();
  if(n.key==='unlock'){toast('Neuer Jäger freigeschaltet: '+HB[n.val].name);}
  return true;
}

// ================= UI =================
function showUI(){
  $('#hubUI').classList.toggle('hide',mode!=='hub');
  $('#hud').classList.toggle('hide',mode!=='run');$('#top').classList.toggle('hide',mode==='run');
  $('#tip').classList.add('hide');$('#info').classList.add('hide');selNode=null;
}
function refreshCur(){
  if(mode==='run'&&R){$('#cS').textContent=fmt(save.souls+R.souls);$('#cB').textContent=fmt(save.brim+R.brim);$('#cG').textContent=fmt(save.sig+R.sig);}
  else{$('#cS').textContent=fmt(save.souls);$('#cB').textContent=fmt(save.brim);$('#cG').textContent=fmt(save.sig);}
}
function refreshHub(){
  refreshCur();computeStats();const h=HB[save.hero];
  $('#sideName').textContent=h.name;$('#sidePass').textContent=h.pass;
  const rows=[['Schaden',fmt(ST.dmg)],['Angriffe/s',ST.aps.toFixed(2)],['Krit',ST.crit.toFixed(0)+'% ×'+ST.critDmg.toFixed(2)],['Leben',fmt(ST.hp)],['Rüstung',fmt(ST.armor)],['Regeneration',ST.regen.toFixed(1)+'/s'],
    ['Jagdzeit',ST.time+'s'],['Bannstrahl',fmt(ST.click)],['Seelen',`×${ST.soul.toFixed(2)}`],['Beute-Sog',ST.collectDelay.toFixed(1)+'s']];
  rows.unshift(['Schwurbaum',NODES.filter(n=>!n.root&&lv(n.id)>0).length+' / '+(NODES.length-1)]);
  if(ST.ls)rows.push(['Lebensraub',(ST.ls*100).toFixed(0)+'%']);if(ST.chain)rows.push(['Kettenblitz',ST.chain]);if(ST.explode)rows.push(['Explosion',(ST.explode*100|0)+'%']);if(ST.execute)rows.push(['Hinrichtung','<'+(ST.execute*100|0)+'%']);
  $('#stats').innerHTML=rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');
  $('#cLbl').textContent=circleName(save.circle);
  $('#cPrev').disabled=save.circle<=1;$('#cNext').disabled=save.circle>=save.maxCircle;
  if(selNode&&!$('#info').classList.contains('hide'))showInfo(selNode);
}
function showInfo(n){
  const el=$('#info');el.innerHTML=nodeHTML(n);
  if(!n.root&&nodeAvail(n)&&lv(n.id)<n.max){const b=document.createElement('button');b.className='big';b.textContent='Kaufen';b.disabled=curAmt(n.cur)<nodeCost(n);b.onclick=()=>{buyNode(n);showInfo(n);};el.appendChild(b);}
  const c=document.createElement('button');c.textContent='Schließen';c.onclick=()=>{el.classList.add('hide');selNode=null;};el.appendChild(c);
  el.classList.remove('hide');
}
function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.remove('hide');}
function closeModal(){$('#modal').classList.add('hide');}
function heroSelect(){
  let h='<h2>JÄGER WÄHLEN</h2><div class="heroes">';
  for(const x of HEROES){const u=heroUnlocked(x);h+=`<div class="hcard ${u?'':'lock'} ${save.hero===x.id?'sel':''}" data-id="${x.id}"><img src="${sprURL(x.spr)}" style="${u?'':'filter:brightness(0)'}"><div class="n" style="color:${x.col}">${x.name}</div><div class="d">${u?x.desc:'Im Schwurbaum freischalten: '+NB[x.unlock].name}</div>${u?`<div class="d" style="margin-top:4px;color:#d8c8b8">${x.pass}</div>`:''}</div>`;}
  h+='</div><div class="row"><button id="hsClose">Fertig</button></div>';
  openModal(h);
  document.querySelectorAll('.hcard').forEach(el=>el.onclick=()=>{const x=HB[el.dataset.id];if(!heroUnlocked(x))return;save.hero=x.id;persist();refreshHub();heroSelect();});
  $('#hsClose').onclick=closeModal;
}
function menu(){
  openModal(`<h2>MENÜ</h2><div style="max-width:440px;font-size:20px;line-height:1.1;color:#d8c8b8">
  <p><b>So spielst du:</b> Starte eine Jagd. Dein Jäger kämpft automatisch. <b>Klicke/tippe</b> auf Dämonen für einen <b>Bannstrahl</b>. Fahre mit dem Zeiger über die Beute, um sie sofort einzusammeln, sonst fliegt sie nach ein paar Sekunden zu dir. Beute, die am Ende noch liegt, geht verloren.</p>
  <p>Töte genug Dämonen, dann erscheint der <b>Aschefürst</b>. Besiegst du ihn, öffnet sich der nächste Höllenkreis.</p>
  <p>Gib Seelen, Schwefel und Siegel im <b>Schwurbaum</b> aus. Ziehen (oder wischen) verschiebt den Baum, das Mausrad zoomt.</p></div>
  <div class="row" style="margin-top:10px"><button id="mMute">${muted?'Ton an':'Ton aus'}</button><button id="mReset" style="border-color:#a03040">Spielstand löschen</button><button id="mClose">Schließen</button></div>`);
  $('#mClose').onclick=closeModal;$('#mMute').onclick=()=>{muted=!muted;menu();};
  $('#mReset').onclick=()=>{const b=$('#mReset');if(b.dataset.c){save=defSave();persist();closeModal();toHub();cam.x=cam.y=0;toast('Neuer Schwur geleistet.');}else{b.dataset.c=1;b.textContent='Wirklich? Nochmal klicken';}};
}
$('#btnHunt').onclick=()=>{startRun();};
$('#btnHeroes').onclick=heroSelect;
$('#btnMenu').onclick=menu;
$('#cPrev').onclick=()=>{save.circle=Math.max(1,save.circle-1);persist();refreshHub();};
$('#cNext').onclick=()=>{save.circle=Math.min(save.maxCircle,save.circle+1);persist();refreshHub();};
$('#sideToggle').onclick=()=>{$('#side').classList.toggle('hide');$('#sideToggle').style.left=$('#side').classList.contains('hide')?'10px':'266px';};
if(W>900){$('#side').classList.remove('hide');$('#sideToggle').style.left='266px';}

// ================= INPUT =================
const pts=new Map();let drag=null,pinch=null;const canHover=matchMedia('(hover:hover)').matches;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  ptr.x=e.clientX;ptr.y=e.clientY;ptr.active=true;ptr.type=e.pointerType;ptr.down=true;
  if(mode==='run'&&R&&!R.over){smite(e.clientX,e.clientY);}
  else if(mode==='hub'){
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};drag=null;}
    else drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  }
});
cv.addEventListener('pointermove',e=>{
  ptr.x=e.clientX;ptr.y=e.clientY;ptr.active=true;ptr.type=e.pointerType;
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode!=='hub')return;
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.z=clamp(pinch.z*d/pinch.d,.35,2.2);return;}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;$('#tip').classList.add('hide');}}
  else if(canHover&&e.pointerType==='mouse'){const n=nodeAt(e.clientX,e.clientY);hoverNode=n;const t=$('#tip');
    if(n){t.innerHTML=nodeHTML(n)+(n.root?'':`<div class="tl" style="margin-top:4px">Klicken zum Kaufen</div>`);t.classList.remove('hide');const x=Math.min(e.clientX+18,W-300),y=Math.min(e.clientY+18,H-170);t.style.left=x+'px';t.style.top=y+'px';cv.style.cursor='pointer';}
    else{t.classList.add('hide');cv.style.cursor='grab';}}
});
function pUp(e){
  pts.delete(e.pointerId);ptr.down=false;
  if(mode==='hub'){
    if(pinch&&pts.size<2){pinch=null;drag=null;return;}
    if(drag&&!drag.moved){const n=nodeAt(e.clientX,e.clientY);
      if(n){if(canHover&&e.pointerType==='mouse'){if(!buyNode(n)&&!n.root&&nodeAvail(n)&&lv(n.id)<n.max){toast('Nicht genug '+{s:'Seelen',b:'Schwefel',g:'Siegel'}[n.cur]);}
          const t=$('#tip');if(!t.classList.contains('hide'))t.innerHTML=nodeHTML(n);}
        else{selNode=n;showInfo(n);}}
      else{$('#info').classList.add('hide');selNode=null;}}
    drag=null;
  }
  if(e.pointerType!=='mouse')ptr.active=false;
}
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){ptr.active=false;hoverNode=null;$('#tip').classList.add('hide');}});
cv.addEventListener('wheel',e=>{if(mode!=='hub')return;e.preventDefault();const before=s2w(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.pow(1.0015,-e.deltaY),.35,2.2);const after=s2w(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y;},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'&&mode==='hub'&&$('#modal').classList.contains('hide')){e.preventDefault();startRun();}});

// ================= LOOP =================
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;sfxCount=0;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  if(mode==='run'&&R){
    updateRun(dt);
    let sx=0,sy=0;if(shake>0){sx=rnd(-shake,shake);sy=rnd(-shake,shake);shake=Math.max(0,shake-dt*40);}
    ctx.save();ctx.translate(sx,sy);renderRun();ctx.restore();
    // HUD
    $('#hpFill').style.width=(100*R.hp/R.maxHp)+'%';$('#hpTxt').textContent=`Leben ${fmt(Math.max(0,R.hp))} / ${fmt(R.maxHp)}`;
    $('#tFill').style.width=(100*R.time/R.maxTime)+'%';$('#tTxt').textContent=`Jagdzeit ${R.time.toFixed(1)}s`;
    if(!R.bossSpawned){$('#qFill').style.width=(100*Math.min(1,R.kills/R.quota))+'%';$('#qTxt').textContent=`Fürst erscheint: ${R.kills}/${R.quota}`;}
    else if(!R.bossDead){const b=R.en.find(e=>e.boss);$('#qFill').style.width=(b?100*b.hp/b.max:0)+'%';$('#qTxt').textContent='ASCHEFÜRST';}
    else{$('#qFill').style.width='100%';$('#qTxt').textContent='Fürst gebannt! Kills: '+R.kills;}
    $('#hS').textContent=fmt(R.souls);$('#hB').textContent=fmt(R.brim);$('#hG').textContent=fmt(R.sig);
    refreshCur();
  }else{
    renderHub(dt);
  }
  requestAnimationFrame(frame);
}
computeStats();showUI();refreshHub();
if(!save.seenIntro){save.seenIntro=true;persist();setTimeout(menu,400);}
requestAnimationFrame(frame);
// debug hook for testing
window.__DJ={get save(){return save},get R(){return R},startRun,toHub,computeStats,NODES,ST:()=>ST};
</script>
