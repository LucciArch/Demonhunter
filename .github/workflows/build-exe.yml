name: Windows-EXE bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install
      - name: EXE bauen
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Daemonenjaeger-Windows
          path: dist/*.exe
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dämonenjäger Build ${{ github.run_number }}
          body: |
            Automatischer Build von Commit ${{ github.sha }}.
            **Portable:** einfach die `-portable.exe` herunterladen und starten.
            **Installer:** die `-setup.exe` installiert das Spiel mit Desktop-Verknüpfung.
          files: dist/*.exe
          make_latest: true
